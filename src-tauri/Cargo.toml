[package]
name = "daily-info-agent"
version = "0.1.0"
description = "Daily Info Agent desktop client"
authors = ["NanluQingshi"]
edition = "2021"

[lib]
name = "daily_info_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
